<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
  <body style="background:#fafbfc;font-family:Arial,Helvetica,sans-serif;color:#333;margin:0;padding:40px 20px">
    <main style="background:#fff;max-width:560px;margin:0 auto;padding:40px 20px;text-align:center">
      <h1 style="font-size:20px">You're invited to {{ project_name }}</h1>
      <p>An administrator invited {{ email }} to create an account.</p>
      <p style="margin:30px"><a href="{{ link }}" style="background:#009688;color:#fff;padding:12px 24px;border-radius:8px;text-decoration:none">Accept invitation</a></p>
      <p>Or copy this link:<br><a href="{{ link }}">{{ link }}</a></p>
      <p style="font-size:14px;color:#555">This one-time invitation expires in {{ valid_hours }} hours. If you weren't expecting it, you can ignore this email.</p>
    </main>
  </body>
</html>
