[project]
name = "app"
version = "0.7.6"
description = ""
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "python-multipart>=0.0.32,<1.0.0",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "tenacity>=9.1.4,<10.0.0",
    "pydantic>=2.13.5",
    "emails>=1.1.2,<2.0",
    "jinja2<4.0.0,>=3.1.4",
    "alembic>=1.19.1,<2.0.0",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "sqlmodel<1.0.0,>=0.0.21",
    "pydantic-settings>=2.15.0,<3.0.0",
    "sentry-sdk[fastapi]>=2.68.1,<3.0.0",
    "pyjwt<3.0.0,>=2.8.0",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "findog-legacy-adapter @ git+https://github.com/oblidog/findog-legacy-core.git@v1.0.0a0",
    "pyyaml>=6.0.3,<7.0.0",
    "jsonschema>=4.26.0,<5.0.0",
    "holidays>=0.99,<1.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.8.3,<5.0.0",
    "pytest>=9.1.1,<10.0.0",
    "mypy>=2.3.0,<3.0.0",
    "pre-commit>=4.3.0,<5.0.0",
    "ruff>=0.16.2,<1.0.0",
    "prek>=0.4.13,<1.0.0",
    "coverage>=7.15.4,<8.0.0",
    "openapi-python-client==0.29.0",
    "types-pyyaml>=6.0.12.20250915,<7.0.0",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py312"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"
omit = [
    "app/alembic/*",
    "app/api/routes/counterparties.py",
    "app/api/routes/integration.py",
    "app/schemas/integration.py",
    "app/services/integration.py",
]

[tool.coverage.html]
show_contexts = true
