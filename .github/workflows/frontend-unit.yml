name: Frontend Unit Tests

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-frontend-unit:
    permissions:
      contents: read
      id-token: write # Authenticate Codecov uploads with OIDC.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Determine test scope
        id: scope
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: python3 scripts/ci_test_scope.py
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.scope.outputs.run_heavy == 'true'
      - run: bun ci
        if: steps.scope.outputs.run_heavy == 'true'
        working-directory: frontend
      - name: Check frontend types with TypeScript 7
        if: steps.scope.outputs.run_heavy == 'true'
        run: bun run typecheck
        working-directory: frontend
      - name: Run fast frontend tests
        if: steps.scope.outputs.run_heavy == 'true'
        run: bun run test:unit --coverage --coverage-reporter=lcov
        working-directory: frontend
      - name: Upload frontend coverage to Codecov
        if: steps.scope.outputs.run_heavy == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: frontend/coverage/lcov.info
          flags: frontend
          disable_search: true
          fail_ci_if_error: false
