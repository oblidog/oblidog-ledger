name: Frontend Unit Tests

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-frontend-unit:
    if: ${{ !startsWith(github.head_ref, 'release/v') && !startsWith(github.head_ref, 'sync/main-to-dev-') }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
        working-directory: frontend
      - name: Run fast frontend tests
        run: bun run test:unit
        working-directory: frontend
