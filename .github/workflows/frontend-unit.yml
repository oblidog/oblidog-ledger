name: Frontend Unit Tests

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-frontend-unit:
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine test scope
        id: scope
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: python3 scripts/ci_test_scope.py
      - uses: oven-sh/setup-bun@v2
        if: steps.scope.outputs.run_heavy == 'true'
      - run: bun ci
        if: steps.scope.outputs.run_heavy == 'true'
        working-directory: frontend
      - name: Run fast frontend tests
        if: steps.scope.outputs.run_heavy == 'true'
        run: bun run test:unit --coverage --coverage-reporter=lcov
        working-directory: frontend
      - name: Upload frontend coverage to Codecov
        if: steps.scope.outputs.run_heavy == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          use_oidc: true
          files: frontend/coverage/lcov.info
          flags: frontend
          disable_search: true
          fail_ci_if_error: false
