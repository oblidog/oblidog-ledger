name: Demo Database Lifecycle

on:
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - '.github/workflows/demo-database-lifecycle.yml'
  workflow_dispatch:
    inputs:
      action:
        description: Migrate schema or initialize and replace the demo ledger
        type: choice
        options:
          - migrate
          - initialize
        required: true
        default: migrate
      deploy_after_migration:
        description: Trigger backend dev Preview deployment after successful migration (test hook)
        type: boolean
        required: false
        default: false
      confirmation:
        description: For initialize only, type replace-demo-ledger
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: demo-database-lifecycle
  cancel-in-progress: false

jobs:
  lifecycle:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: demo-preview
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Apply requested demo database operation
        working-directory: backend
        env:
          DEMO_POSTGRES_URL: ${{ secrets.DEMO_POSTGRES_URL }}
          DEMO_NEON_HOST: ${{ secrets.DEMO_NEON_HOST }}
          DEMO_FIRST_SUPERUSER_PASSWORD: ${{ secrets.DEMO_FIRST_SUPERUSER_PASSWORD }}
          DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
          DEMO_ACTION: ${{ github.event_name == 'push' && 'migrate' || inputs.action }}
          DEMO_CONFIRMATION: ${{ inputs.confirmation || '' }}
        run: python scripts/run_vercel_demo_lifecycle.py "$DEMO_ACTION" --confirmation "$DEMO_CONFIRMATION"

      # This deploy hook must point to the backend project's dev Preview branch.
      # Enable only after disabling Vercel's independent Git auto-deploys.
      - name: Trigger backend Preview deployment after successful migration
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'migrate' && inputs.deploy_after_migration)
        env:
          VERCEL_DEMO_BACKEND_DEPLOY_HOOK: ${{ secrets.VERCEL_DEMO_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEMO_BACKEND_DEPLOY_HOOK" ]; then
            echo "::error::Configure VERCEL_DEMO_BACKEND_DEPLOY_HOOK in demo-preview before enabling gated deployments."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --max-time 30 --request POST "$VERCEL_DEMO_BACKEND_DEPLOY_HOOK" >/dev/null
