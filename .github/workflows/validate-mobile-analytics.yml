name: Validate mobile analytics charts

on:
  push:
    branches:
      - fix/230-mobile-analytics-charts

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
        working-directory: frontend
      - name: Remove accidental registry helper
        run: bun remove cn
        working-directory: frontend
      - name: Format and lint
        run: bunx biome check --write --unsafe --no-errors-on-unmatched --files-ignore-unknown=true ./
        working-directory: frontend
      - name: Build frontend
        run: bun run build
        working-directory: frontend
      - name: Commit validated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-mobile-analytics.yml
          git add frontend/package.json frontend/src/components/Analytics/AnalyticsDashboard.tsx frontend/src/components/ui/chart.tsx frontend/tests/analytics.spec.ts bun.lock
          git commit -m "fix(analytics): finalize responsive charts"
          git push
