name: Playwright Tests

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types:
    - opened
    - synchronize
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: 'false'

env:
  PROJECT_NAME: Oblidog
  DOMAIN: localhost
  FRONTEND_HOST: http://localhost:5173
  ENVIRONMENT: local
  STACK_NAME: oblidog-ledger-ci
  BACKEND_CORS_ORIGINS: http://localhost,http://localhost:5173
  SECRET_KEY: ci-secret-key-not-for-production
  FIRST_SUPERUSER: admin@example.com
  FIRST_SUPERUSER_PASSWORD: ci-admin-password
  POSTGRES_SERVER: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: findog
  POSTGRES_USER: findog
  POSTGRES_PASSWORD: ci-postgres-password
  DOCKER_IMAGE_BACKEND: oblidog-ledger-backend
  DOCKER_IMAGE_FRONTEND: oblidog-ledger-frontend

jobs:
  changes:
    runs-on: ubuntu-latest
    # Set job outputs to values from filter step
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      run_heavy: ${{ steps.scope.outputs.run_heavy }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Determine test scope
      id: scope
      env:
        HEAD_REF: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      run: python3 scripts/ci_test_scope.py
    # For pull requests it's not necessary to checkout the code but for the main branch it is
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
      id: filter
      with:
        filters: |
          changed:
            - backend/**
            - frontend/**
            - emails/**
            - package.json
            - bun.lock
            - .env
            - compose*.yml
            - .github/workflows/playwright.yml
            - .github/ci.env
            - scripts/**
            - tests/test_ci_test_scope.py
            - pyproject.toml
            - uv.lock

  test-playwright:
    needs:
      - changes
    if: ${{ needs.changes.outputs.changed == 'true' && needs.changes.outputs.run_heavy == 'true' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Create CI environment file
      run: cp .github/ci.env .env
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
    - name: Verify Playwright package and Docker image versions match
      run: |
        package_version="$(bun -e 'const pkg = await Bun.file("frontend/package.json").json(); console.log(pkg.devDependencies["@playwright/test"].replace(/^[^0-9]*/, ""))')"
        image_version="$(sed -n 's|^FROM mcr.microsoft.com/playwright:v\([^-]*\)-.*|\1|p' frontend/Dockerfile.playwright)"
        if [ -z "$image_version" ] || [ "$package_version" != "$image_version" ]; then
          echo "::error::Playwright package ($package_version) and Docker image ($image_version) versions must match"
          exit 1
        fi
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.14'
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true' }}
      with:
        limit-access-to-actor: true
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: '0.12.7'
    - run: uv sync
      working-directory: backend
    - run: bun ci
      working-directory: frontend
    - run: bash scripts/generate-client.sh
    - name: Verify email helpers
      run: bun test ./tests/utils/mailpit.unit.ts
      working-directory: frontend
    - run: docker compose -p findog-e2e -f compose.e2e.yml build
    - run: docker compose -p findog-e2e -f compose.e2e.yml down -v --remove-orphans
    - name: Run Playwright tests
      run: docker compose -p findog-e2e -f compose.e2e.yml run --rm playwright bunx playwright test --fail-on-flaky-tests --trace=retain-on-failure --reporter=html
    - run: docker compose -p findog-e2e -f compose.e2e.yml down -v --remove-orphans
      if: ${{ always() }}
    - name: Upload HTML report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: html-report--attempt-${{ github.run_attempt }}
        path: frontend/playwright-report
        retention-days: 30
        include-hidden-files: true

  # https://github.com/marketplace/actions/alls-green#why
  alls-green-playwright:  # This job does nothing and is only used for the branch protection
    if: always()
    needs:
      - changes
      - test-playwright
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test-playwright
