name: Playwright Tests

permissions:
  contents: read

on:
  push:
    branches:
    - dev
  pull_request:
    types:
    - opened
    - synchronize
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: 'false'

env:
  PROJECT_NAME: Oblidog
  DOMAIN: localhost
  FRONTEND_HOST: http://localhost:5173
  ENVIRONMENT: local
  STACK_NAME: oblidog-ledger-ci
  BACKEND_CORS_ORIGINS: http://localhost,http://localhost:5173
  SECRET_KEY: ci-secret-key-not-for-production
  FIRST_SUPERUSER: admin@example.com
  FIRST_SUPERUSER_PASSWORD: ci-admin-password
  POSTGRES_SERVER: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: findog
  POSTGRES_USER: findog
  POSTGRES_PASSWORD: ci-postgres-password
  DOCKER_IMAGE_BACKEND: oblidog-ledger-backend
  DOCKER_IMAGE_FRONTEND: oblidog-ledger-frontend

jobs:
  changes:
    runs-on: ubuntu-latest
    # Set job outputs to values from filter step
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
    - uses: actions/checkout@v7
    # For pull requests it's not necessary to checkout the code but for the main branch it is
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          changed:
            - backend/**
            - frontend/**
            - .env
            - compose*.yml
            - .github/workflows/playwright.yml

  test-playwright:
    needs:
      - changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Create CI environment file
      run: cp .github/ci.env .env
    - uses: oven-sh/setup-bun@v2
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true' }}
      with:
        limit-access-to-actor: true
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: '0.12.7'
    - run: uv sync
      working-directory: backend
    - run: bun ci
      working-directory: frontend
    - run: bash scripts/generate-client.sh
    - run: docker compose build
    - run: docker compose down -v --remove-orphans
    - name: Run Playwright tests
      run: docker compose run --rm playwright bunx playwright test --fail-on-flaky-tests --trace=retain-on-failure --reporter=html
    - run: docker compose down -v --remove-orphans
      if: ${{ always() }}
    - name: Upload HTML report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: html-report--attempt-${{ github.run_attempt }}
        path: frontend/playwright-report
        retention-days: 30
        include-hidden-files: true

  # https://github.com/marketplace/actions/alls-green#why
  alls-green-playwright:  # This job does nothing and is only used for the branch protection
    if: always()
    needs:
      - test-playwright
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test-playwright
