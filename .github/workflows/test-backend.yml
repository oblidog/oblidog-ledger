name: Test Backend

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: Oblidog
  DOMAIN: localhost
  FRONTEND_HOST: http://localhost:5173
  ENVIRONMENT: local
  STACK_NAME: oblidog-ledger-ci
  BACKEND_CORS_ORIGINS: http://localhost,http://localhost:5173
  SECRET_KEY: ci-secret-key-not-for-production
  FIRST_SUPERUSER: admin@example.com
  FIRST_SUPERUSER_PASSWORD: ci-admin-password
  POSTGRES_SERVER: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: findog
  POSTGRES_USER: findog
  POSTGRES_PASSWORD: ci-postgres-password
  DOCKER_IMAGE_BACKEND: oblidog-ledger-backend
  DOCKER_IMAGE_FRONTEND: oblidog-ledger-frontend

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate deployment variants
        shell: bash
        run: |
          bash -n scripts/db-backup.sh scripts/db-restore-drill.sh scripts/deploy-latest.sh

          cp .env.standalone.example .env
          sed -i \
            -e 's/replace-with-a-random-secret/ci-secret/' \
            -e 's/replace-with-a-strong-password/ci-admin-password/' \
            -e 's/replace-with-the-database-password/ci-db-password/' \
            .env
          ./scripts/validate-deployment.sh standalone compose.standalone.yml

          cp .env.production.example .env
          sed -i \
            -e 's/replace-with-a-random-secret/ci-secret/' \
            -e 's/replace-with-a-strong-password/ci-admin-password/' \
            -e 's/replace-with-the-database-password/ci-db-password/' \
            -e 's/postgres.example.com/postgres.internal/' \
            .env
          ./scripts/validate-deployment.sh external compose.production.yml

          install_root="$PWD"
          standalone_dir="$(mktemp -d)"
          (
            cd "$standalone_dir"
            OBLIDOG_INSTALL_BASE_URL="file://$install_root" bash "$install_root/scripts/install.sh" standalone
            test -x scripts/db-backup.sh
            test -x scripts/db-restore-drill.sh
            test -f docs/operations/database-recovery.md
            sed -i \
              -e 's/replace-with-a-random-secret/ci-secret/' \
              -e 's/replace-with-a-strong-password/ci-admin-password/' \
              -e 's/replace-with-the-database-password/ci-db-password/' \
              .env
            ./validate-deployment.sh standalone

            fake_bin="$(mktemp -d)"
            cat >"$fake_bin/docker" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$*" == *"SELECT version_num FROM alembic_version"* ]]; then
            printf 'test-revision\n'
          else
            printf 'test-dump'
          fi
          EOF
            chmod +x "$fake_bin/docker"
            PATH="$fake_bin:$PATH" BACKUP_DIR="$standalone_dir/backups" \
              ./scripts/db-backup.sh
            test "$(find backups -name '*.dump' -type f | wc -l)" -eq 1
            grep -q '^alembic_revision=test-revision$' backups/*.metadata
          )

          external_dir="$(mktemp -d)"
          (
            cd "$external_dir"
            OBLIDOG_INSTALL_BASE_URL="file://$install_root" bash "$install_root/scripts/install.sh" external
            test -x scripts/db-backup.sh
            test -x scripts/db-restore-drill.sh
            test -f docs/operations/database-recovery.md
            sed -i \
              -e 's/replace-with-a-random-secret/ci-secret/' \
              -e 's/replace-with-a-strong-password/ci-admin-password/' \
              -e 's/replace-with-the-database-password/ci-db-password/' \
              -e 's/postgres.example.com/postgres.internal/' \
              .env
            ./validate-deployment.sh external
          )

          legacy_dir="$(mktemp -d)"
          touch "$legacy_dir/.env" "$legacy_dir/compose.yml"
          if (cd "$legacy_dir" && OBLIDOG_INSTALL_BASE_URL="file://$install_root" bash "$install_root/scripts/install.sh"); then
            echo "Installer unexpectedly replaced an unmarked existing deployment." >&2
            exit 1
          fi
      - name: Determine test scope
        id: scope
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          if [[ "$HEAD_REF" == release/v* || "$HEAD_REF" == sync/main-to-dev-* ]]; then
            echo "Skipping heavy backend tests for trusted release metadata or back-sync PR."
            echo "run_heavy=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create CI environment file
        if: steps.scope.outputs.run_heavy == 'true'
        run: cp .github/ci.env .env
      - name: Set up Python
        if: steps.scope.outputs.run_heavy == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        if: steps.scope.outputs.run_heavy == 'true'
        uses: astral-sh/setup-uv@v7
      - name: Test release tooling
        if: steps.scope.outputs.run_heavy == 'true'
        run: uv run --frozen pytest -q tests/test_extract_release_notes.py
      - name: Test demo lifecycle guard without database access
        if: steps.scope.outputs.run_heavy == 'true'
        working-directory: backend
        run: uv run --locked pytest -q scripts/tests
      - run: docker compose down -v --remove-orphans
        if: steps.scope.outputs.run_heavy == 'true'
      - run: docker compose up -d --wait db mailcatcher
        if: steps.scope.outputs.run_heavy == 'true'
      - name: Create test database
        if: steps.scope.outputs.run_heavy == 'true'
        run: docker compose exec -T db createdb -U "$POSTGRES_USER" findog_test
      - name: Migrate DB
        if: steps.scope.outputs.run_heavy == 'true'
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        if: steps.scope.outputs.run_heavy == 'true'
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - name: Export integration OpenAPI schema
        if: steps.scope.outputs.run_heavy == 'true'
        run: uv run python scripts/export_integration_openapi.py
        working-directory: backend
      - name: Validate integration OpenAPI schema
        if: steps.scope.outputs.run_heavy == 'true'
        shell: bash
        run: |
          python -m json.tool openapi/integration.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          spec = json.loads(Path("openapi/integration.json").read_text())
          assert "openapi" in spec, "Missing OpenAPI version"
          assert spec["info"]["title"] == "Oblidog Integration API"
          assert spec["info"]["description"] == "Integration API for Oblidog Ledger."
          paths = spec.get("paths", {})
          assert paths, "No paths exported"
          unexpected = [path for path in paths if not path.startswith("/api/v1/integration")]
          assert not unexpected, f"Unexpected non-integration paths: {unexpected}"
          PY
      - name: Validate integration OpenAPI client generation
        if: steps.scope.outputs.run_heavy == 'true'
        run: uv run bash scripts/validate_integration_openapi_client.sh
        working-directory: backend
      - run: docker compose down -v --remove-orphans
        if: ${{ always() && steps.scope.outputs.run_heavy == 'true' }}
      - name: Store coverage files
        if: steps.scope.outputs.run_heavy == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
      - name: Coverage report
        if: steps.scope.outputs.run_heavy == 'true'
        run: uv run coverage report --fail-under=85
        working-directory: backend
