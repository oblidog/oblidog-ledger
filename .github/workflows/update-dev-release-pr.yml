name: Update dev release PR

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: update-dev-release-pr
  cancel-in-progress: true

jobs:
  update-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev with complete history
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Fetch release branches
        run: git fetch origin main dev --no-tags

      - name: Check whether dev differs from main
        id: diff
        shell: bash
        run: |
          if git diff --quiet origin/main..dev; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "dev and main have identical trees; nothing to release."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect merged pull requests
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr list \
            --base dev \
            --state merged \
            --limit 200 \
            --json number,title,body,headRefName,mergeCommit,mergedAt,url \
            > "$RUNNER_TEMP/merged-prs.json"

      - name: Build release pull request body
        if: steps.diff.outputs.has_changes == 'true'
        env:
          MERGED_PRS_FILE: ${{ runner.temp }}/merged-prs.json
          RELEASE_BODY_FILE: ${{ runner.temp }}/release-pr-body.md
        shell: python
        run: |
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          prs = json.loads(Path(os.environ["MERGED_PRS_FILE"]).read_text())

          def is_ancestor(commit: str, ref: str) -> bool:
              result = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", commit, ref],
                  check=False,
              )
              return result.returncode == 0

          included = []
          for pr in prs:
              head = pr.get("headRefName") or ""
              if head.startswith("sync/main-to-dev-"):
                  continue

              merge_commit = (pr.get("mergeCommit") or {}).get("oid")
              if not merge_commit:
                  continue

              if not is_ancestor(merge_commit, "dev"):
                  continue
              if is_ancestor(merge_commit, "origin/main"):
                  continue

              included.append(pr)

          included.sort(key=lambda pr: pr.get("mergedAt") or "")

          sections = {
              "Features": [],
              "Fixes": [],
              "Maintenance": [],
              "Other": [],
          }

          def section_for(title: str) -> str:
              match = re.match(r"^([a-zA-Z]+)(?:\([^)]*\))?!?:", title.strip())
              kind = match.group(1).lower() if match else ""
              if kind == "feat":
                  return "Features"
              if kind in {"fix", "perf"}:
                  return "Fixes"
              if kind in {"build", "chore", "ci", "docs", "refactor", "style", "test"}:
                  return "Maintenance"
              return "Other"

          closing_pattern = re.compile(
              r"(?im)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b"
          )
          issue_numbers = set()

          for pr in included:
              title = (pr.get("title") or "").strip()
              number = pr["number"]
              sections[section_for(title)].append(f"- #{number} {title}")

              body = pr.get("body") or ""
              issue_numbers.update(int(value) for value in closing_pattern.findall(body))

          lines = [
              "## Release summary",
              "",
              "This pull request is maintained automatically from changes merged into `dev` that are not yet in `main`.",
              "",
          ]

          if included:
              for heading, entries in sections.items():
                  if not entries:
                      continue
                  lines.extend([f"### {heading}", "", *entries, ""])
          else:
              lines.extend([
                  "No merged pull requests could be associated with the current `dev` delta.",
                  "",
              ])

          lines.extend(["### Issues resolved on merge", ""])
          if issue_numbers:
              lines.extend(f"Closes #{number}" for number in sorted(issue_numbers))
          else:
              lines.append("No closing issue references were found in the included pull requests.")

          lines.extend([
              "",
              "---",
              "_Generated by `update-dev-release-pr.yml`. Manual edits to this body may be overwritten._",
              "",
          ])

          Path(os.environ["RELEASE_BODY_FILE"]).write_text("\n".join(lines))

      - name: Create or update dev to main pull request
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY_FILE: ${{ runner.temp }}/release-pr-body.md
        shell: bash
        run: |
          existing_pr="$(gh pr list \
            --base main \
            --head dev \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" \
              --title "chore(release): merge dev into main" \
              --body-file "$RELEASE_BODY_FILE"
            echo "Updated release PR #${existing_pr}."
            exit 0
          fi

          gh pr create \
            --base main \
            --head dev \
            --title "chore(release): merge dev into main" \
            --body-file "$RELEASE_BODY_FILE"
