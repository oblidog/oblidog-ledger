name: Workflow Security

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
      - '**/action.yml'
      - '**/action.yaml'
      - '**/zizmor.yml'
      - '**/zizmor.yaml'
      - '.github/zizmor*'
      - 'scripts/link_pr_issues.py'
      - 'tests/test_link_pr_issues.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Audit workflows, actions, and Dependabot
        # No repository secrets or GitHub API token are needed for local audits.
        run: uvx zizmor==1.31.1 --offline --strict-collection --format github .
      - name: Test issue-linking automation
        run: python3 -m unittest discover -s tests -p 'test_link_pr_issues.py'
