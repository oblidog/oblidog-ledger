name: Workflow Security

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
      - '**/action.yml'
      - '**/action.yaml'
      - '**/zizmor.yml'
      - '**/zizmor.yaml'
      - '.github/zizmor*'
  push:
    branches: [dev, main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
      - '**/action.yml'
      - '**/action.yaml'
      - '**/zizmor.yml'
      - '**/zizmor.yaml'
      - '.github/zizmor*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Audit workflows, actions, and Dependabot
        # No repository secrets or GitHub API token are needed for local audits.
        run: uvx zizmor==1.31.1 --offline --strict-collection --format github .
