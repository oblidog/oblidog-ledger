name: Bootstrap shadcn chart

on:
  push:
    branches:
      - fix/230-mobile-analytics-charts

permissions:
  contents: write

jobs:
  add-chart:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Add chart component
        run: bunx --bun shadcn@latest add chart --yes
        working-directory: frontend
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-shadcn-chart.yml
          git add frontend/package.json frontend/src/components/ui/chart.tsx bun.lock
          git commit -m "chore(ui): add shadcn chart primitives"
          git push
