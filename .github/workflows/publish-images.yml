name: Publish container images

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to rebuild
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  PROJECT_NAME: Oblidog
  DOMAIN: localhost
  FRONTEND_HOST: http://localhost:5173
  ENVIRONMENT: local
  STACK_NAME: oblidog-ledger-ci
  BACKEND_CORS_ORIGINS: http://localhost,http://localhost:5173
  SECRET_KEY: ci-secret-key-not-for-production
  FIRST_SUPERUSER: admin@example.com
  FIRST_SUPERUSER_PASSWORD: ci-admin-password
  POSTGRES_SERVER: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: findog
  POSTGRES_USER: findog
  POSTGRES_PASSWORD: ci-postgres-password
  DOCKER_IMAGE_BACKEND: oblidog-ledger-backend
  DOCKER_IMAGE_FRONTEND: oblidog-ledger-frontend

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
            build_args: ""
          - name: frontend
            dockerfile: frontend/Dockerfile
            build_args: VITE_APP_VERSION=${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Validate published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == "false" ]]

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/oblidog-ledger-${{ matrix.name }}
          tags: type=raw,value=${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Build and publish ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  regenerate-python-client:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Python client regeneration
        env:
          CLIENT_REPO_TOKEN: ${{ secrets.FINDOG_CLIENT_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: |
          if [[ -z "$CLIENT_REPO_TOKEN" ]]; then
            echo "FINDOG_CLIENT_TOKEN is not configured; skipping client regeneration trigger."
            exit 0
          fi

          GH_TOKEN="$CLIENT_REPO_TOKEN" gh api \
            --method POST \
            repos/oblidog/oblidog-client-python/dispatches \
            --input - <<EOF
          {
            "event_type": "ledger-release",
            "client_payload": {
              "tag_name": "${RELEASE_TAG}"
            }
          }
          EOF
