version: 2

multi-ecosystem-groups:
  web-stack:
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 3
    assignees: [wini83]
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies, internal]

updates:
  # GitHub Actions: Dependabot updates full SHA pins and their version comments.
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 3
    assignees: [wini83]
    commit-message:
      prefix: "ci(deps)"
    labels: [dependencies, internal]
    groups:
      non-major:
        update-types: [minor, patch]
  # Python uv
  - package-ecosystem: uv
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 3
    assignees: [wini83]
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies, internal]
    groups:
      non-major:
        update-types: [minor, patch]
  # One Bun entry covers both workspaces through the root bun.lock.
  # Batch the web stack together: Playwright and its browser image must stay
  # synchronized. Separate entries for the same directory would overlap.
  # No cooldown here: Docker may lack publication dates and bypass cooldown.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    assignees: [wini83]
    labels: [dependencies, internal]
    groups:
      non-major:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@hey-api/openapi-ts"
    patterns: ["*"]
    multi-ecosystem-group: web-stack
  # Include all base images, while keeping Playwright in the same batch.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    assignees: [wini83]
    labels: [dependencies, internal]
    groups:
      non-major:
        update-types: [minor, patch]
    # Python minor/major upgrades require dependency and CI validation together.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    patterns: ["*"]
    multi-ecosystem-group: web-stack
  # Docker Compose
  - package-ecosystem: docker-compose
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 3
    assignees: [wini83]
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies, internal]
    groups:
      non-major:
        update-types: [minor, patch]
