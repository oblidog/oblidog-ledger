version: 2

multi-ecosystem-groups:
  playwright:
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 3
    assignees: [wini83]
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, internal]

updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 3
    assignees: [wini83]
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, internal]
    groups:
      non-major:
        update-types: [minor, patch]
  # Python uv
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 3
    assignees: [wini83]
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, internal]
    groups:
      non-major:
        update-types: [minor, patch]
  # bun
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    assignees: [wini83]
    labels: [dependencies, internal]
    groups:
      non-major:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@hey-api/openapi-ts"
    patterns: ["@playwright/test"]
    multi-ecosystem-group: playwright
  # Docker
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    assignees: [wini83]
    labels: [dependencies, internal]
    groups:
      non-major:
        update-types: [minor, patch]
    patterns: ["playwright"]
    multi-ecosystem-group: playwright
  # Docker Compose
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 3
    assignees: [wini83]
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, internal]
    groups:
      non-major:
        update-types: [minor, patch]
