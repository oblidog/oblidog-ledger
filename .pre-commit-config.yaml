# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: end-of-file-fixer
        exclude: |
            (?x)^(
                frontend/src/client/.*|
                backend/app/email-templates/build/.*
            )$
      - id: trailing-whitespace
        exclude: ^frontend/src/client/.*
  - repo: local
    hooks:
      - id: commitizen-check
        name: commitizen check
        entry: bash -lc 'commit_msg_file="$(realpath "$1")"; cd backend && uv run cz check --allow-abort --commit-msg-file "$commit_msg_file"' --
        language: system
        stages: [commit-msg]

      - id: local-biome-check
        name: biome check
        entry: bash ./scripts/bun.sh run --filter frontend lint
        language: system
        pass_filenames: false
        types: [text]
        files: ^frontend/

      - id: local-ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix --exit-non-zero-on-fix
        require_serial: true
        language: unsupported
        types: [python]

      - id: local-ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude --exit-non-zero-on-format
        require_serial: true
        language: unsupported
        types: [python]

      - id: local-mypy
        name: mypy
        entry: bash -lc 'cd backend && uv run mypy .'
        pass_filenames: false
        require_serial: true
        language: system
        files: ^backend/.*\.py$

      - id: generate-frontend-sdk
        name: Generate Frontend SDK
        entry: bash ./scripts/generate-client.sh
        pass_filenames: false
        language: unsupported
        files: ^backend/.*$|^scripts/generate-client\.sh$
