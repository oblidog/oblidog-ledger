services:
  adminer:
    profiles:
      - tools

  db:
    env_file: !override
      - .env.demo

  mailcatcher:
    profiles:
      - tools

  prestart:
    env_file: !override
      - .env.demo

  backend:
    env_file: !override
      - .env.demo
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=demo
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - DEMO_USER_PASSWORD=${DEMO_USER_PASSWORD?Variable not set}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}

  scheduler:
    profiles:
      - system-run-scheduler

  proxy:
    profiles:
      - tools

  playwright:
    profiles:
      - e2e

  demo-seed:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-demo-local}'
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      prestart:
        condition: service_completed_successfully
    env_file: !override
      - .env.demo
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=demo
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - DEMO_USER_PASSWORD=${DEMO_USER_PASSWORD?Variable not set}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
    command: ["python", "-m", "app.demo_seed"]
