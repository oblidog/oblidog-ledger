# Production stack for an external database and reverse proxy. Do not combine
# this file with compose.yml or compose.standalone.yml.
services:
  prestart:
    image: ghcr.io/oblidog/oblidog-ledger-backend:${TAG?Set TAG in .env}
    restart: "no"
    command: bash scripts/prestart.sh
    env_file:
      - .env
    networks:
      - firefly_net

  backend:
    image: ghcr.io/oblidog/oblidog-ledger-backend:${TAG?Set TAG in .env}
    restart: always
    depends_on:
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    # Optional legacy import configuration:
    # volumes:
    #   - ./backend/config/legacy-import.yaml:/app/backend/config/legacy-import.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/readiness-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      firefly_net:
        aliases:
          # Legacy alias retained for existing reverse-proxy deployments.
          - findog-ledger-backend

  scheduler:
    image: ghcr.io/oblidog/oblidog-ledger-backend:${TAG?Set TAG in .env}
    restart: always
    depends_on:
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=${POSTGRES_SERVER?Set POSTGRES_SERVER in .env}
      - POSTGRES_PORT=${POSTGRES_PORT?Set POSTGRES_PORT in .env}
      - POSTGRES_DB=${POSTGRES_DB?Set POSTGRES_DB in .env}
      - POSTGRES_USER=${POSTGRES_USER?Set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Set POSTGRES_PASSWORD in .env}
      - SYSTEM_RUN_SCHEDULE=${SYSTEM_RUN_SCHEDULE:-5 0 * * *}
      - SYSTEM_RUN_TIMEZONE=${SYSTEM_RUN_TIMEZONE:-Europe/Warsaw}
      - SYSTEM_RUN_STALE_AFTER_MINUTES=${SYSTEM_RUN_STALE_AFTER_MINUTES:-120}
      - SYSTEM_RUN_TIMEOUT_SECONDS=${SYSTEM_RUN_TIMEOUT_SECONDS:-3600}
      - TZ=${SYSTEM_RUN_TIMEZONE:-Europe/Warsaw}
    command: ["/app/backend/scripts/system-run-scheduler.sh"]
    networks:
      - firefly_net

  frontend:
    image: ghcr.io/oblidog/oblidog-ledger-frontend:${TAG?Set TAG in .env}
    restart: always
    env_file:
      - .env
    networks:
      firefly_net:
        aliases:
          # Legacy alias retained for existing reverse-proxy deployments.
          - findog-ledger-frontend

  adminer:
    image: adminer:latest
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: ${POSTGRES_SERVER?Set POSTGRES_SERVER in .env}
    networks:
      firefly_net:
        aliases:
          # Legacy alias retained for existing reverse-proxy deployments.
          - findog-ledger-adminer

networks:
  firefly_net:
    external: true
