[tool.uv.workspace]
members = ["backend"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
update_changelog_on_bump = true
pre_bump_hooks = ["uv lock"]
version_provider = "commitizen"
version = "0.7.8"
version_files = [
    "backend/pyproject.toml:^version = \"(?P<version>.*)\"",
    "pyproject.toml:^version = \"(?P<version>.*)\"",
    "frontend/package.json:^  \"version\": \"(?P<version>.*)\",",
]
annotated_tag = true
